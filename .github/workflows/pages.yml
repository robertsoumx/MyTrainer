name: Verify and publish MyTrainer
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mytrainer-pages
  cancel-in-progress: false
jobs:
  publishing-mode:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - name: Select the final Pages publisher
        id: mode
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getPages(context.repo);
            // Branch publishing also launches GitHub's root/Jekyll build.
            // Wait for that workflow to complete before publishing dist/.
            const waitForLegacy = context.eventName === 'push' && data.build_type === 'legacy';
            core.setOutput('publish', String(!waitForLegacy));
            core.info(waitForLegacy ? 'The application will publish after the default Pages build.' : 'Publishing the compiled application.');
  build:
    needs: publishing-mode
    if: needs.publishing-mode.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/fetch-assets.py
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v4
