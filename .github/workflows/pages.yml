name: Verify and publish MyTrainer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: mytrainer-pages
  cancel-in-progress: false
jobs:
  publishing-order:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for the default Pages publisher
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getPages(context.repo);
            if (data.build_type !== 'legacy') return;
            // Dynamic Pages workflows do not emit workflow_run here.
            // Wait explicitly, so a root/Jekyll build cannot overwrite dist/.
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 100
              });
              const legacy = runs.workflow_runs.find(run => run.name === 'pages build and deployment');
              if (legacy?.status === 'completed') {
                core.info(`Default Pages build finished (${legacy.conclusion}); publishing the application next.`);
                return;
              }
              if (context.eventName === 'workflow_dispatch' && !legacy) return;
              if (attempt % 6 === 0) core.info('Waiting for the default Pages build for this commit.');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('The default Pages publisher did not finish within ten minutes. Rerun after it completes.');
  build:
    needs: publishing-order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/fetch-assets.py --fonts-only
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v4
